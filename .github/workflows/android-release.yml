name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for manual release (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x apps/android/gradlew

      - name: Configure Signing Keystore
        working-directory: apps/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating signing keystore for automated release builds..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias androidreleasekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Grabbit, OU=Mobile, O=Grabbit, L=City, S=State, C=US"
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androidreleasekey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        working-directory: apps/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          RELEASE_APK=$(find apps/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          echo "Found release APK: $RELEASE_APK"
          cp "$RELEASE_APK" release-assets/Grabbit.apk
          
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.release_tag || 'latest' }}"
          fi
          cp release-assets/Grabbit.apk "release-assets/Grabbit-${TAG}.apk"
          ls -la release-assets/

      - name: Upload Artifact to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: Grabbit-Android-APK
          path: release-assets/Grabbit.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-assets/Grabbit.apk
            release-assets/Grabbit-*.apk
          name: "Grabbit Android ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
